name: Release

# Push a version tag (e.g. v0.1.0) → build the signed Windows installers and
# publish them as a GitHub Release (live, no draft). Fully hands-off; no manual
# publish step. The package managers publish from here: .github/workflows/
# winget.yml and choco.yml both run on this workflow completing successfully —
# so keep this job about building, and let a store outage fail only its own run.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for signed auto-updates. Generate with `bun tauri signer generate`
          # and store both as repository secrets (Settings → Secrets → Actions).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "mdedit ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

  # winget and Chocolatey are published by .github/workflows/winget.yml and
  # choco.yml, which run automatically after this Release completes (and can
  # each be triggered manually to backfill a version).
