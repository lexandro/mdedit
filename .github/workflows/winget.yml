name: winget

# Submit a released version to microsoft/winget-pkgs. Runs automatically after a
# successful Release, and can be triggered manually to (re)publish a specific
# already-released version (e.g. to backfill one an expired WINGET_TOKEN ate).
# Deliberately NOT a job inside release.yml: a winget outage there failed the
# whole Release run, which in turn skipped the Chocolatey workflow_run job.
# Needs a WINGET_TOKEN secret (classic PAT, public_repo scope) — see
# docs/RELEASING.md. The very first version must be submitted once manually.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.11.1"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve release tag
        id: tag
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TAG_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${VERSION_INPUT:-$TAG_REF}"
          if [ -z "$version" ]; then echo "No version to publish" >&2; exit 1; fi
          echo "tag=v${version#v}" >> "$GITHUB_OUTPUT"

      # `CreateRef` failures below are ambiguous: an expired, revoked,
      # fine-grained or wrong-scope PAT all produce the same message a stale
      # fork does. Rule the token out here so the next debug session starts
      # from the fork instead of burning a PAT rotation on it (that is exactly
      # what v0.11.0 and v0.11.1 cost).
      - name: Check WINGET_TOKEN
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error::WINGET_TOKEN secret is not set."; exit 1
          fi
          code=$(curl -sS -D headers.txt -o user.json -w '%{http_code}' \
            -H "Authorization: Bearer $WINGET_TOKEN" https://api.github.com/user)
          if [ "$code" != "200" ]; then
            echo "::error::GitHub rejected WINGET_TOKEN (HTTP $code) — the PAT is expired, revoked or malformed."; exit 1
          fi
          scopes=$(tr -d '\r' < headers.txt | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: *//p')
          if [ -z "$scopes" ]; then
            echo "::error::WINGET_TOKEN carries no OAuth scopes, so it is a fine-grained PAT. winget-releaser only supports a classic PAT with public_repo."; exit 1
          fi
          case ",$(echo "$scopes" | tr -d ' ')," in
            *,repo,*|*,public_repo,*) ;;
            *) echo "::error::WINGET_TOKEN scopes are '$scopes' — winget-releaser needs the public_repo scope."; exit 1 ;;
          esac
          echo "Token belongs to $(jq -r .login user.json); scopes: $scopes"

      # THE fix for the `CreateRef` failure: komac branches off our winget-pkgs
      # fork, and its own sync-fork is unreliable (Komac #1142, #1726), so a
      # fork left behind upstream fails branch creation with a message that
      # blames permissions. Ours went stale the moment releases paused, which
      # is what actually ate v0.11.0 and v0.11.1 — a fresh PAT did not help,
      # syncing did. Best-effort: GitHub refuses the sync when upstream touched
      # its workflow files unless the PAT also has the `workflow` scope, and
      # komac may still get through on its own (see doccmd#1020).
      - name: Sync winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          fork="${{ github.repository_owner }}/winget-pkgs"
          if ! gh repo sync "$fork" --source microsoft/winget-pkgs; then
            echo "::warning::Could not sync $fork. If the next step fails with CreateRef, sync it by hand — or add the workflow scope to WINGET_TOKEN."
          fi

      # Third-party action that receives WINGET_TOKEN — pinned to a commit so a
      # retagged v2 can't silently change what runs with that PAT.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: lexandro.mdedit
          installers-regex: '\.msi$'
          release-tag: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}

      # A failed publish is otherwise only visible on the Actions tab, so a
      # version can silently go missing from a package manager (that's how the
      # Chocolatey 0.10.0 push stayed broken for a month). File an issue — but
      # only for the automatic run: a manual backfill is watched live, and
      # filing one issue per retry is how the 0.0.0-notify-test issue happened.
      - name: Report failure
        if: ${{ failure() && github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > body.md <<EOF
          $TAG was **not** submitted to microsoft/winget-pkgs. Logs: $run_url

          A "does not have the correct permissions to execute CreateRef" error is almost
          always the **stale winget-pkgs fork**, not the PAT — the Check WINGET_TOKEN step
          above already rules the token out. Run
          "gh repo sync $GITHUB_REPOSITORY_OWNER/winget-pkgs --source microsoft/winget-pkgs",
          then re-run via Actions -> winget -> Run workflow with this version. If the sync
          itself is refused, WINGET_TOKEN needs the workflow scope as well.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "winget publish failed for $TAG" --body-file body.md
